<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KomaWeave — Manga &amp; Manhwa Typesetting Studio</title>
  <link rel="stylesheet" href="/static/vendor/pico.min.css" />
  <style>
    :root {
      --pico-font-size: 14.5px;
      --pico-border-radius: 6px;
    }
    body {
      margin: 0;
      background: #f6f7f9;
      min-height: 100vh;
    }
    .workbench {
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 1.25rem;
      max-width: 1520px;
      margin: 0 auto;
      padding: 1.25rem;
      align-items: start;
    }
    @media (max-width: 960px) {
      .workbench { grid-template-columns: 1fr; }
    }
    article.card {
      margin: 0;
      padding: 1.15rem;
      background: #ffffff;
      border: 1px solid #e2e6ec;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04);
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #5c6676;
      padding-bottom: 0.75rem;
      margin-bottom: 0.85rem;
      border-bottom: 1px solid #edf0f5;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d97706;
      margin-right: 6px;
    }
    .dot.ready { background: #16a34a; }
    .dropzone {
      border: 1.5px dashed #cbd5e1;
      border-radius: 6px;
      padding: 1.1rem 0.9rem;
      text-align: center;
      cursor: pointer;
      background: #fafbfc;
      margin-bottom: 0.9rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: #0f172a;
      background: #f1f5f9;
    }
    .dropzone small { color: #64748b; display: block; margin-top: 0.2rem; }
    .file-summary { font-size: 0.82rem; font-weight: 600; color: #0f172a; margin-top: 0.4rem; word-break: break-all; }
    .sub-panel {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.8rem;
      margin-bottom: 0.9rem;
    }
    .inline-group {
      display: flex;
      gap: 0.4rem;
      align-items: stretch;
    }
    .inline-group > input, .inline-group > select { flex: 1; margin-bottom: 0; }
    .inline-group > button { width: auto; margin-bottom: 0; padding: 0.45rem 0.75rem; font-size: 0.82rem; }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .metric-cell {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.55rem 0.65rem;
    }
    .metric-cell .k { font-size: 0.7rem; text-transform: uppercase; color: #64748b; }
    .metric-cell .v { font-size: 0.95rem; font-weight: 700; color: #0f172a; }
    .viewer-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }
    .canvas-stage {
      min-height: 540px;
      background: #181a1f;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0.5rem;
    }
    .canvas-stage img {
      max-width: 100%;
      max-height: 78vh;
      object-fit: contain;
      display: block;
    }
    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      width: 100%;
    }
    .split-grid img { width: 100%; max-height: 75vh; object-fit: contain; }
    .placeholder { color: #94a3b8; font-size: 0.92rem; }
    .regions-list {
      max-height: 280px;
      overflow-y: auto;
      margin-top: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .region-row {
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 0.55rem 0.75rem;
      background: #fafbfc;
      font-size: 0.84rem;
    }
    .region-row .src { color: #64748b; }
    .region-row .dst { color: #0f172a; font-weight: 600; margin-top: 0.2rem; }
    label { font-size: 0.82rem; font-weight: 600; margin-bottom: 0.25rem; }
    select, input[type="text"], input[type="password"] { margin-bottom: 0.7rem; }
  </style>
</head>
<body>
  <main class="workbench">
    <article class="card">
      <div class="status-bar">
        <span><span id="statusDot" class="dot"></span><span id="statusText">Connecting...</span></span>
        <span id="deviceBadge"></span>
      </div>

      <div id="dropzone" class="dropzone">
        <strong>Drop image(s) or chapter folder(s) here</strong>
        <small>Max 25 MB/image · 8192×16384 px · Single page, strip, or multi-chapter folders</small>
        <div style="display:flex;gap:0.4rem;justify-content:center;flex-wrap:wrap;margin-top:0.55rem;" onclick="event.stopPropagation()">
          <button type="button" id="pickImagesBtn" class="secondary outline" style="padding:0.35rem 0.65rem;font-size:0.78rem;width:auto;margin:0;">Select Images</button>
          <button type="button" id="pickFolderBtn" class="secondary outline" style="padding:0.35rem 0.65rem;font-size:0.78rem;width:auto;margin:0;">Select Folder</button>
          <button type="button" id="addFolderBtn" class="secondary outline" style="padding:0.35rem 0.65rem;font-size:0.78rem;width:auto;margin:0;">+ Add Chapter Folder</button>
          <button type="button" id="clearQueueBtn" class="secondary outline" hidden style="padding:0.35rem 0.65rem;font-size:0.78rem;width:auto;margin:0;">Clear</button>
        </div>
        <div id="fileName" class="file-summary"></div>
        <input type="file" id="fileInput" accept="image/*" multiple hidden />
        <input type="file" id="folderInput" webkitdirectory directory multiple hidden />
        <input type="file" id="addFolderInput" webkitdirectory directory multiple hidden />
      </div>

      <label for="providerSelect">Translation Provider</label>
      <select id="providerSelect"></select>

      <div id="aiConfigBox" class="sub-panel" hidden>
        <div id="customUrlWrap" hidden>
          <label for="baseUrlInput">API Base URL</label>
          <input type="text" id="baseUrlInput" placeholder="https://api.example.com/v1" />
        </div>

        <label for="apiKeyInput">API Key <small id="keyStatus" style="font-weight:400;color:#64748b;"></small></label>
        <div class="inline-group" style="margin-bottom:0.7rem;">
          <input type="password" id="apiKeyInput" placeholder="Enter API key..." />
          <button type="button" id="saveKeyBtn" class="secondary">Save</button>
          <button type="button" id="clearKeyBtn" class="outline secondary" hidden>Clear</button>
        </div>

        <label for="modelSelect">Model</label>
        <div class="inline-group" style="margin-bottom:0.5rem;">
          <select id="modelSelect"></select>
          <button type="button" id="refreshModelsBtn" class="secondary">Fetch</button>
        </div>
        <input type="text" id="manualModelInput" placeholder="Or enter model ID manually..." style="margin-bottom:0;" />
      </div>

      <div class="grid" style="gap:0.6rem;">
        <div>
          <label for="sourceLang">Source</label>
          <select id="sourceLang">
            <option value="auto" selected>Auto-Detect</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="zh-CN">Chinese</option>
            <option value="en">English</option>
          </select>
        </div>
        <div>
          <label for="targetLang">Target</label>
          <select id="targetLang"></select>
        </div>
      </div>

      <label id="consolidatedWrap" hidden style="display:flex;align-items:center;gap:0.45rem;margin-bottom:0.8rem;font-weight:500;">
        <input type="checkbox" id="consolidatedChk" checked style="margin:0;" />
        Treat batch as single chapter/set (shared context)
      </label>

      <button id="translateBtn" disabled style="width:100%;margin-bottom:0.5rem;">Translate</button>
      <button id="downloadBtn" class="secondary outline" hidden style="width:100%;">Download Output</button>

      <div id="metricsSection" hidden>
        <div class="metrics-grid">
          <div class="metric-cell"><div class="k">Total</div><div id="mTotal" class="v">-</div></div>
          <div class="metric-cell"><div class="k">OCR</div><div id="mOcr" class="v">-</div></div>
          <div class="metric-cell"><div class="k">Translate</div><div id="mTrans" class="v">-</div></div>
          <div class="metric-cell"><div class="k">Inpaint</div><div id="mInpaint" class="v">-</div></div>
          <div class="metric-cell"><div class="k">Render</div><div id="mRender" class="v">-</div></div>
          <div class="metric-cell"><div class="k">Details</div><div id="mRemoval" class="v">-</div></div>
        </div>
      </div>
    </article>

    <article class="card">
      <div class="viewer-toolbar">
        <div role="group" style="margin:0;">
          <button id="tabResult" class="btn-tab" style="padding:0.4rem 0.8rem;">Translated</button>
          <button id="tabOriginal" class="secondary outline btn-tab" style="padding:0.4rem 0.8rem;">Original</button>
          <button id="tabSplit" class="secondary outline btn-tab" style="padding:0.4rem 0.8rem;">Split</button>
        </div>
        <div id="batchNav" hidden style="display:flex;align-items:center;gap:0.5rem;">
          <button id="prevPageBtn" class="secondary outline" style="padding:0.35rem 0.7rem;margin:0;">Prev</button>
          <span id="batchPageLabel" style="font-size:0.84rem;color:#475569;">1 / 1</span>
          <button id="nextPageBtn" class="secondary outline" style="padding:0.35rem 0.7rem;margin:0;">Next</button>
        </div>
      </div>

      <div id="canvasWrap" class="canvas-stage">
        <span class="placeholder">Upload a page, long strip, or chapter batch to begin.</span>
      </div>

      <div id="blocksSection" hidden style="margin-top:1rem;">
        <strong style="font-size:0.9rem;">Translated Regions (<span id="blockCount">0</span>)</strong>
        <div id="blocksList" class="regions-list"></div>
      </div>
    </article>
  </main>

  <script>
    const fileInput = document.getElementById('fileInput');
    const folderInput = document.getElementById('folderInput');
    const addFolderInput = document.getElementById('addFolderInput');
    const pickImagesBtn = document.getElementById('pickImagesBtn');
    const pickFolderBtn = document.getElementById('pickFolderBtn');
    const addFolderBtn = document.getElementById('addFolderBtn');
    const clearQueueBtn = document.getElementById('clearQueueBtn');
    const dropzone = document.getElementById('dropzone');
    const fileNameEl = document.getElementById('fileName');
    const targetLangEl = document.getElementById('targetLang');
    const sourceLangEl = document.getElementById('sourceLang');
    const providerSelect = document.getElementById('providerSelect');
    const aiConfigBox = document.getElementById('aiConfigBox');
    const customUrlWrap = document.getElementById('customUrlWrap');
    const baseUrlInput = document.getElementById('baseUrlInput');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const keyStatus = document.getElementById('keyStatus');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const clearKeyBtn = document.getElementById('clearKeyBtn');
    const modelSelect = document.getElementById('modelSelect');
    const refreshModelsBtn = document.getElementById('refreshModelsBtn');
    const manualModelInput = document.getElementById('manualModelInput');
    const consolidatedWrap = document.getElementById('consolidatedWrap');
    const consolidatedChk = document.getElementById('consolidatedChk');
    const translateBtn = document.getElementById('translateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvasWrap = document.getElementById('canvasWrap');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const deviceBadge = document.getElementById('deviceBadge');
    const batchNav = document.getElementById('batchNav');
    const batchPageLabel = document.getElementById('batchPageLabel');

    let selectedFiles = [];
    let selectedEntries = []; // [{ file, chapter, name }]
    let originalUrls = [];
    let batchResults = [];
    let currentIdx = 0;
    let viewMode = 'result';
    let providersMap = {};
    let currentProviderId = '';
    const draftKeys = {};
    const draftModels = {};
    const draftUrls = {};

    const MAX_FILE_BYTES = 25 * 1024 * 1024;
    const MAX_IMG_W = 16384;
    const MAX_IMG_H = 32768;
    const MAX_IMG_PIXELS = 120000000;

    function getServerApiKey() {
      return sessionStorage.getItem('komaweave_api_key') || '';
    }

    async function apiFetch(url, options = {}) {
      const headers = new Headers(options.headers || {});
      const key = getServerApiKey();
      if (key) headers.set('X-API-Key', key);
      let res = await fetch(url, { ...options, headers });
      if (res.status === 401) {
        const entered = window.prompt('Enter KomaWeave Server API Key (KOMAWEAVE_API_KEY):');
        if (entered && entered.trim()) {
          sessionStorage.setItem('komaweave_api_key', entered.trim());
          headers.set('X-API-Key', entered.trim());
          res = await fetch(url, { ...options, headers });
        }
      }
      return res;
    }

    async function init() {
      try {
        const hRes = await fetch('/api/health');
        const h = await hRes.json();
        statusDot.classList.toggle('ready', h.status === 'ready');
        statusText.textContent = h.status === 'ready' ? 'Ready' : 'Initializing';
        deviceBadge.textContent = h.device;

        if (h.auth_required && !getServerApiKey()) {
          const entered = window.prompt('This KomaWeave server requires an API key (KOMAWEAVE_API_KEY):');
          if (entered && entered.trim()) {
            sessionStorage.setItem('komaweave_api_key', entered.trim());
          }
        }

        const [lRes, pRes] = await Promise.all([
          apiFetch('/api/languages'),
          apiFetch('/api/providers'),
        ]);

        const l = await lRes.json();
        Object.entries(l.languages).forEach(([code, name]) => {
          const opt = document.createElement('option');
          opt.value = code;
          opt.textContent = name;
          if (code === 'ar') opt.selected = true;
          targetLangEl.appendChild(opt);
        });

        const p = await pRes.json();
        p.providers.forEach((prov) => {
          providersMap[prov.id] = prov;
          const opt = document.createElement('option');
          opt.value = prov.id;
          opt.textContent = prov.name;
          providerSelect.appendChild(opt);
        });
        onProviderChange();
      } catch (e) {
        statusText.textContent = 'Offline';
      }
    }

    function populateModelSelect(models, selected) {
      modelSelect.innerHTML = '';
      const list = models && models.length ? models : (selected ? [selected] : []);
      if (!list.length) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '-- Click Fetch or type manually --';
        modelSelect.appendChild(opt);
        return;
      }
      list.forEach((m) => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        if (m === selected) opt.selected = true;
        modelSelect.appendChild(opt);
      });
    }

    async function fetchModels(auto = false) {
      const pid = providerSelect.value;
      const prov = providersMap[pid];
      if (!prov || !prov.requires_key) return;
      refreshModelsBtn.disabled = true;
      refreshModelsBtn.textContent = '...';
      try {
        const res = await apiFetch(`/api/providers/${pid}/models`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            api_key: apiKeyInput.value.trim() || null,
            base_url: baseUrlInput.value.trim() || null,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Failed to fetch models');
        populateModelSelect(data.models, manualModelInput.value.trim() || prov.selected_model || '');
      } catch (err) {
        if (!auto) alert(err.message);
      } finally {
        refreshModelsBtn.disabled = false;
        refreshModelsBtn.textContent = 'Fetch';
      }
    }

    function onProviderChange() {
      if (currentProviderId && providersMap[currentProviderId]?.requires_key) {
        draftKeys[currentProviderId] = apiKeyInput.value;
        draftModels[currentProviderId] = manualModelInput.value || modelSelect.value || '';
        draftUrls[currentProviderId] = baseUrlInput.value;
      }
      const pid = providerSelect.value;
      currentProviderId = pid;
      const prov = providersMap[pid];
      if (!prov || !prov.requires_key) {
        aiConfigBox.hidden = true;
        return;
      }
      aiConfigBox.hidden = false;
      customUrlWrap.hidden = !prov.supports_custom_url;
      baseUrlInput.value = draftUrls[pid] !== undefined ? draftUrls[pid] : (prov.base_url || '');
      apiKeyInput.value = draftKeys[pid] || '';
      apiKeyInput.placeholder = prov.has_key
        ? `Saved (${prov.masked_key}) — leave blank to keep`
        : 'Enter API key...';
      keyStatus.textContent = prov.has_key ? `✓ Saved (${prov.masked_key})` : '(Not saved)';
      keyStatus.style.color = prov.has_key ? '#16a34a' : '#64748b';
      clearKeyBtn.hidden = !prov.has_key;
      const savedModel = draftModels[pid] !== undefined ? draftModels[pid] : (prov.selected_model || '');
      manualModelInput.value = '';
      populateModelSelect(savedModel ? [savedModel] : [], savedModel);
      if (prov.has_key || apiKeyInput.value.trim()) fetchModels(true);
    }

    providerSelect.addEventListener('change', onProviderChange);
    refreshModelsBtn.addEventListener('click', () => fetchModels(false));

    async function persistProviderConfig(silent = false) {
      const pid = providerSelect.value;
      const prov = providersMap[pid];
      if (!prov || !prov.requires_key) return true;
      const typedKey = apiKeyInput.value.trim();
      const chosenModel = manualModelInput.value.trim() || modelSelect.value || null;
      const res = await apiFetch(`/api/providers/${pid}/config`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          api_key: typedKey || null,
          base_url: baseUrlInput.value.trim() || null,
          selected_model: chosenModel,
        }),
      });
      const data = await res.json();
      if (!res.ok) {
        if (!silent) alert(data.detail || 'Failed to save');
        return false;
      }
      providersMap[pid] = data.provider;
      draftKeys[pid] = '';
      draftModels[pid] = data.provider.selected_model || '';
      apiKeyInput.value = '';
      apiKeyInput.placeholder = data.provider.has_key
        ? `Saved (${data.provider.masked_key}) — leave blank to keep`
        : 'Enter API key...';
      keyStatus.textContent = data.provider.has_key ? `✓ Saved (${data.provider.masked_key})` : '(Not saved)';
      keyStatus.style.color = data.provider.has_key ? '#16a34a' : '#64748b';
      clearKeyBtn.hidden = !data.provider.has_key;
      return true;
    }

    saveKeyBtn.addEventListener('click', async () => {
      if (await persistProviderConfig(false)) {
        fetchModels(true);
      }
    });

    clearKeyBtn.addEventListener('click', async () => {
      const pid = providerSelect.value;
      const res = await apiFetch(`/api/providers/${pid}/key`, { method: 'DELETE' });
      const data = await res.json();
      if (res.ok) {
        providersMap[pid] = data.provider;
        draftKeys[pid] = '';
        apiKeyInput.value = '';
        apiKeyInput.placeholder = 'Enter API key...';
        keyStatus.textContent = '(Not saved)';
        keyStatus.style.color = '#64748b';
        clearKeyBtn.hidden = true;
      }
    });

    function naturalSortKey(s) {
      return s.split(/(\d+)/).map((p) => (/^\d+$/.test(p) ? Number(p) : p.toLowerCase()));
    }
    function naturalCompare(a, b) {
      const ka = naturalSortKey(a), kb = naturalSortKey(b);
      for (let i = 0; i < Math.max(ka.length, kb.length); i++) {
        if (ka[i] === undefined) return -1;
        if (kb[i] === undefined) return 1;
        if (ka[i] !== kb[i]) return ka[i] < kb[i] ? -1 : 1;
      }
      return 0;
    }

    async function validateImageFile(file) {
      if (file.size > MAX_FILE_BYTES) {
        throw new Error(`'${file.name}' exceeds 25 MB limit (${(file.size / 1048576).toFixed(1)} MB).`);
      }
      const url = URL.createObjectURL(file);
      try {
        const dims = await new Promise((resolve, reject) => {
          const im = new Image();
          im.onload = () => resolve({ w: im.naturalWidth, h: im.naturalHeight });
          im.onerror = () => reject(new Error(`Invalid or corrupted image: ${file.name}`));
          im.src = url;
        });
        if (dims.w > MAX_IMG_W || dims.h > MAX_IMG_H || dims.w * dims.h > MAX_IMG_PIXELS) {
          throw new Error(`'${file.name}' (${dims.w}x${dims.h}) exceeds max allowed dimensions (${MAX_IMG_W}x${MAX_IMG_H}, 40 MP).`);
        }
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function extractChapterAndName(file, relPathOverride = '') {
      const rel = relPathOverride || file.webkitRelativePath || file.name;
      const parts = rel.split('/').filter(Boolean);
      if (parts.length >= 2) {
        return { chapter: parts.slice(0, -1).join('/'), name: parts[parts.length - 1] };
      }
      return { chapter: '', name: file.name };
    }

    async function queueEntries(rawEntries, append = false) {
      const valid = [];
      for (const item of rawEntries) {
        if (!item.file.type.startsWith('image/') && !/\.(png|jpe?g|webp)$/i.test(item.file.name)) continue;
        try {
          await validateImageFile(item.file);
          valid.push(item);
        } catch (err) {
          alert(err.message);
          return;
        }
      }
      if (!valid.length) return;
      valid.sort((a, b) => naturalCompare(`${a.chapter}/${a.name}`, `${b.chapter}/${b.name}`));
      selectedEntries = append ? [...selectedEntries, ...valid] : valid;
      selectedFiles = selectedEntries.map((e) => e.file);
      originalUrls.forEach((u) => URL.revokeObjectURL(u));
      originalUrls = selectedFiles.map((f) => URL.createObjectURL(f));
      batchResults = [];
      currentIdx = 0;
      batchNav.hidden = true;
      downloadBtn.hidden = true;
      translateBtn.disabled = false;
      clearQueueBtn.hidden = false;
      consolidatedWrap.hidden = selectedFiles.length <= 1;

      const chapters = [...new Set(selectedEntries.map((e) => e.chapter || 'Single Batch'))];
      if (selectedFiles.length === 1) {
        fileNameEl.textContent = `${selectedFiles[0].name} (${(selectedFiles[0].size / 1024).toFixed(1)} KB)`;
        translateBtn.textContent = 'Translate';
      } else {
        const totalMb = (selectedFiles.reduce((s, f) => s + f.size, 0) / 1048576).toFixed(1);
        const chLabel = chapters.length > 1 ? `${chapters.length} chapters · ` : '';
        fileNameEl.textContent = `${chLabel}${selectedFiles.length} pages (${totalMb} MB)`;
        translateBtn.textContent = chapters.length > 1
          ? `Translate ${chapters.length} Chapters (${selectedFiles.length} pages)`
          : `Translate Batch (${selectedFiles.length})`;
      }
      renderView();
    }

    async function setFiles(fileList, append = false) {
      const entries = Array.from(fileList || []).map((f) => ({
        file: f,
        ...extractChapterAndName(f),
      }));
      await queueEntries(entries, append);
    }

    async function traverseEntry(entry, prefix = '') {
      if (entry.isFile) {
        const file = await new Promise((res, rej) => entry.file(res, rej));
        const rel = prefix ? `${prefix}/${entry.name}` : entry.name;
        return [{ file, ...extractChapterAndName(file, rel) }];
      }
      if (entry.isDirectory) {
        const reader = entry.createReader();
        const children = [];
        while (true) {
          const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
          if (!batch.length) break;
          children.push(...batch);
        }
        const subPrefix = prefix ? `${prefix}/${entry.name}` : entry.name;
        const nested = await Promise.all(children.map((c) => traverseEntry(c, subPrefix)));
        return nested.flat();
      }
      return [];
    }

    pickImagesBtn.addEventListener('click', () => fileInput.click());
    pickFolderBtn.addEventListener('click', () => folderInput.click());
    addFolderBtn.addEventListener('click', () => addFolderInput.click());
    clearQueueBtn.addEventListener('click', () => {
      selectedEntries = [];
      selectedFiles = [];
      batchResults = [];
      originalUrls.forEach((u) => URL.revokeObjectURL(u));
      originalUrls = [];
      fileNameEl.textContent = '';
      clearQueueBtn.hidden = true;
      downloadBtn.hidden = true;
      batchNav.hidden = true;
      translateBtn.disabled = true;
      translateBtn.textContent = 'Translate';
      canvasWrap.innerHTML = '<span class="placeholder">Upload manga or manhwa pages to begin</span>';
    });

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => { setFiles(e.target.files, false); e.target.value = ''; });
    folderInput.addEventListener('change', (e) => { setFiles(e.target.files, false); e.target.value = ''; });
    addFolderInput.addEventListener('change', (e) => { setFiles(e.target.files, true); e.target.value = ''; });
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', async (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const items = Array.from(e.dataTransfer.items || []);
      const entries = items.map((it) => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
      if (entries.length && entries.some((en) => en.isDirectory)) {
        const all = (await Promise.all(entries.map((en) => traverseEntry(en)))).flat();
        await queueEntries(all, false);
      } else {
        await setFiles(e.dataTransfer.files, false);
      }
    });

    function renderView() {
      const orig = originalUrls[currentIdx];
      const tr = batchResults[currentIdx]?.image_base64;
      if (!orig && !tr) return;
      if (viewMode === 'split' && orig && tr) {
        canvasWrap.innerHTML = `<div class="split-grid"><img src="${orig}" alt="Original" /><img src="${tr}" alt="Translated" /></div>`;
      } else if (viewMode === 'original' || !tr) {
        canvasWrap.innerHTML = `<img src="${orig}" alt="Original" />`;
      } else {
        canvasWrap.innerHTML = `<img src="${tr}" alt="Translated" />`;
      }
      if (batchResults.length > 1) {
        batchNav.hidden = false;
        batchPageLabel.textContent = `${currentIdx + 1} / ${batchResults.length}`;
      } else {
        batchNav.hidden = true;
      }
      if (batchResults[currentIdx]) {
        const cur = batchResults[currentIdx];
        document.getElementById('blocksSection').hidden = false;
        document.getElementById('blockCount').textContent = cur.block_count;
        document.getElementById('blocksList').innerHTML = cur.blocks.map((b) => `
          <div class="region-row">
            <div class="src">${b.source_text}</div>
            <div class="dst" dir="auto">${b.translated_text}</div>
          </div>
        `).join('');
      }
    }

    document.getElementById('prevPageBtn').onclick = () => {
      if (currentIdx > 0) { currentIdx--; renderView(); }
    };
    document.getElementById('nextPageBtn').onclick = () => {
      if (currentIdx < batchResults.length - 1) { currentIdx++; renderView(); }
    };

    function switchTab(mode, btn) {
      viewMode = mode;
      document.querySelectorAll('.btn-tab').forEach((b) => b.classList.add('secondary', 'outline'));
      btn.classList.remove('secondary', 'outline');
      renderView();
    }
    document.getElementById('tabResult').onclick = (e) => switchTab('result', e.target);
    document.getElementById('tabOriginal').onclick = (e) => switchTab('original', e.target);
    document.getElementById('tabSplit').onclick = (e) => switchTab('split', e.target);

    function crc32(bytes) {
      let c = 0xFFFFFFFF;
      for (let i = 0; i < bytes.length; i++) {
        c ^= bytes[i];
        for (let k = 0; k < 8; k++) c = (c >>> 1) ^ (c & 1 ? 0xEDB88320 : 0);
      }
      return (c ^ 0xFFFFFFFF) >>> 0;
    }

    function buildZipBlob(entries) {
      const enc = new TextEncoder();
      const localParts = [];
      const centralParts = [];
      let offset = 0;
      for (const { path, bytes } of entries) {
        const nameBytes = enc.encode(path);
        const crc = crc32(bytes);
        const lh = new Uint8Array(30 + nameBytes.length);
        const lv = new DataView(lh.buffer);
        lv.setUint32(0, 0x04034b50, true);
        lv.setUint16(4, 20, true);
        lv.setUint16(8, 0, true);
        lv.setUint32(14, crc, true);
        lv.setUint32(18, bytes.length, true);
        lv.setUint32(22, bytes.length, true);
        lv.setUint16(26, nameBytes.length, true);
        lh.set(nameBytes, 30);
        localParts.push(lh, bytes);

        const ch = new Uint8Array(46 + nameBytes.length);
        const cv = new DataView(ch.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, bytes.length, true);
        cv.setUint32(24, bytes.length, true);
        cv.setUint16(28, nameBytes.length, true);
        cv.setUint32(42, offset, true);
        ch.set(nameBytes, 46);
        centralParts.push(ch);
        offset += lh.length + bytes.length;
      }
      const cdSize = centralParts.reduce((s, p) => s + p.length, 0);
      const eocd = new Uint8Array(22);
      const ev = new DataView(eocd.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(8, entries.length, true);
      ev.setUint16(10, entries.length, true);
      ev.setUint32(12, cdSize, true);
      ev.setUint32(16, offset, true);
      return new Blob([...localParts, ...centralParts, eocd], { type: 'application/zip' });
    }

    function dataUriToBytes(uri) {
      const b64 = uri.split(',')[1];
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    translateBtn.addEventListener('click', async () => {
      if (!selectedFiles.length) return;
      translateBtn.disabled = true;
      translateBtn.setAttribute('aria-busy', 'true');
      translateBtn.textContent = 'Processing...';

      const pid = providerSelect.value;
      if (apiKeyInput.value.trim()) {
        await persistProviderConfig(true);
      }
      const chosenModel = manualModelInput.value.trim() || modelSelect.value || '';

      try {
        if (selectedFiles.length === 1) {
          const fd = new FormData();
          fd.append('target_lang', targetLangEl.value);
          fd.append('source_lang', sourceLangEl.value);
          fd.append('provider', pid);
          if (chosenModel) fd.append('model', chosenModel);
          if (apiKeyInput.value.trim()) fd.append('api_key', apiKeyInput.value.trim());
          if (baseUrlInput.value.trim()) fd.append('base_url', baseUrlInput.value.trim());
          fd.append('file', selectedFiles[0]);
          const res = await apiFetch('/api/translate', { method: 'POST', body: fd });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Translation failed');
          batchResults = [{ ...data, _outPath: selectedEntries[0].name.replace(/\.[^.]+$/, '.png') }];
          currentIdx = 0;

          document.getElementById('metricsSection').hidden = false;
          document.getElementById('mTotal').textContent = `${data.timings_s.total.toFixed(2)}s`;
          document.getElementById('mOcr').textContent = `${data.timings_s.ocr.toFixed(2)}s`;
          document.getElementById('mTrans').textContent = `${data.timings_s.translate.toFixed(2)}s`;
          document.getElementById('mInpaint').textContent = `${data.timings_s.inpaint.toFixed(2)}s`;
          document.getElementById('mRender').textContent = `${data.timings_s.render.toFixed(2)}s`;
          document.getElementById('mRemoval').textContent = `${data.inpaint_stats.solid_filled} / ${data.inpaint_stats.aot_inpainted}`;
        } else {
          const groups = new Map();
          for (const entry of selectedEntries) {
            const key = entry.chapter || 'chapter';
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(entry);
          }
          const groupEntries = Array.from(groups.entries());
          const allResults = [];
          let sumTotal = 0, sumOcr = 0, sumTrans = 0, sumInpaint = 0, sumRender = 0;

          for (let gIdx = 0; gIdx < groupEntries.length; gIdx++) {
            const [chName, chItems] = groupEntries[gIdx];
            if (groupEntries.length > 1) {
              translateBtn.textContent = `Chapter ${gIdx + 1}/${groupEntries.length} (${chName})...`;
            }
            const fd = new FormData();
            fd.append('target_lang', targetLangEl.value);
            fd.append('source_lang', sourceLangEl.value);
            fd.append('provider', pid);
            if (chosenModel) fd.append('model', chosenModel);
            if (apiKeyInput.value.trim()) fd.append('api_key', apiKeyInput.value.trim());
            if (baseUrlInput.value.trim()) fd.append('base_url', baseUrlInput.value.trim());
            fd.append('consolidated', consolidatedChk.checked ? 'true' : 'false');
            chItems.forEach((it) => fd.append('files', it.file));

            const res = await apiFetch('/api/translate-batch', { method: 'POST', body: fd });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || `Chapter '${chName}' failed`);

            data.results.forEach((r, i) => {
              const item = chItems[i];
              const baseName = item.name.replace(/\.[^.]+$/, '.jpg');
              const outPath = item.chapter ? `${item.chapter}/${baseName}` : baseName;
              allResults.push({ ...r, _outPath: outPath });
            });
            const cs = data.chapter_timings_s;
            sumTotal += cs.total;
            sumOcr += cs.ocr;
            sumTrans += cs.translate;
            sumInpaint += cs.inpaint;
            sumRender += cs.render;
          }

          batchResults = allResults;
          currentIdx = 0;
          document.getElementById('metricsSection').hidden = false;
          document.getElementById('mTotal').textContent = `${sumTotal.toFixed(2)}s`;
          document.getElementById('mOcr').textContent = `${sumOcr.toFixed(2)}s`;
          document.getElementById('mTrans').textContent = `${sumTrans.toFixed(2)}s`;
          document.getElementById('mInpaint').textContent = `${sumInpaint.toFixed(2)}s`;
          document.getElementById('mRender').textContent = `${sumRender.toFixed(2)}s`;
          document.getElementById('mRemoval').textContent = `${allResults.length} pages (${groupEntries.length} ch)`;
        }

        switchTab('result', document.getElementById('tabResult'));
        downloadBtn.hidden = false;
        if (batchResults.length === 1) {
          downloadBtn.textContent = 'Download';
          downloadBtn.onclick = () => {
            const a = document.createElement('a');
            a.href = batchResults[0].image_base64;
            a.download = `translated_${targetLangEl.value}_${selectedEntries[0].name.replace(/\.[^.]+$/, '')}.png`;
            a.click();
          };
        } else {
          downloadBtn.textContent = `Download All (.zip)`;
          downloadBtn.onclick = () => {
            const zipEntries = batchResults.map((r) => ({
              path: r._outPath,
              bytes: dataUriToBytes(r.image_base64),
            }));
            const blob = buildZipBlob(zipEntries);
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `komaweave_${targetLangEl.value}_${batchResults.length}pages.zip`;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
          };
        }
      } catch (err) {
        alert(err.message);
      } finally {
        translateBtn.disabled = false;
        translateBtn.removeAttribute('aria-busy');
        const chapters = [...new Set(selectedEntries.map((e) => e.chapter || 'Single Batch'))];
        translateBtn.textContent = selectedFiles.length <= 1
          ? 'Translate'
          : (chapters.length > 1
              ? `Translate ${chapters.length} Chapters (${selectedFiles.length} pages)`
              : `Translate Batch (${selectedFiles.length})`);
      }
    });

    init();
  </script>
</body>
</html>
